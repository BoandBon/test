<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Nông Trại Cloud — Chăn Nuôi & Trồng Trọt Thực Tế 4K Cho Gen Z</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
    <style>
         :root {
            --brown: #4A2C1D;
            --brown-soft: #8A5E48;
            --cream: #FFF6E6;
            --cream-card: #FFFBF2;
            --butter: #FFD66B;
            --mint: #A8E6CF;
            --mint-dark: #1B6B3A;
            --peach: #FFD3C6;
            --coral: #FF9A8B;
            --coral-strong: #FF7F6E;
            --sky: #B5DEFF;
            --lilac: #DCCBFF;
            --purple-deep: #6B4A8C;
            --gold-glow: #FFE066;
        }
        
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-color: #F4E7D3;
            background-image: radial-gradient(#E5CFAF 2px, transparent 2.5px), radial-gradient(#EAD8BD 2px, transparent 2.5px);
            background-size: 28px 28px;
            background-position: 0 0, 14px 14px;
            font-family: 'Nunito', system-ui, -apple-system, sans-serif;
            font-weight: 700;
            color: var(--brown);
            overflow-x: hidden;
        }
        
        button,
        input,
        select,
        textarea {
            font-family: inherit;
            color: var(--brown);
        }
        
        button {
            cursor: pointer;
            border: 0;
            padding: 0;
            background: transparent;
            user-select: none;
        }
        
        button:disabled {
            cursor: not-allowed;
            opacity: 0.55;
        }
        /* Cozy Neo-Brutalism + Tactile Jelly & Felt System */
        
        .jelly {
            border-radius: 20px;
            font-weight: 800;
            border: 2.5px solid var(--brown);
            box-shadow: inset 0 3px 0 rgba(255, 255, 255, 0.65), 0 4.5px 0 var(--brown);
            transition: transform 0.08s cubic-bezier(.2, .8, .4, 1), box-shadow 0.08s;
            flex-shrink: 0;
        }
        
        .jelly:hover:not(:disabled) {
            filter: brightness(1.02);
        }
        
        .jelly:active:not(:disabled) {
            transform: translateY(3.5px);
            box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.5), 0 1px 0 var(--brown);
        }
        
        .jelly-sm {
            border-radius: 14px;
            font-weight: 800;
            border: 2px solid var(--brown);
            box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.6), 0 3px 0 var(--brown);
            transition: transform 0.08s, box-shadow 0.08s;
            flex-shrink: 0;
        }
        
        .jelly-sm:active:not(:disabled) {
            transform: translateY(2.5px);
            box-shadow: 0 0.5px 0 var(--brown);
        }
        
        .felt {
            position: relative;
            display: block;
            flex-shrink: 0;
            border-radius: 26px;
            border: 2.5px solid var(--brown);
            box-shadow: 0 5px 0 rgba(74, 44, 29, 0.18);
        }
        
        .felt::after {
            content: '';
            position: absolute;
            inset: 5px;
            border: 2px dashed rgba(255, 255, 255, 0.85);
            border-radius: 20px;
            pointer-events: none;
        }
        
        .c-butter {
            background: var(--butter);
        }
        
        .c-mint {
            background: var(--mint);
        }
        
        .c-peach {
            background: var(--peach);
        }
        
        .c-coral {
            background: var(--coral);
        }
        
        .c-sky {
            background: var(--sky);
        }
        
        .c-lilac {
            background: var(--lilac);
        }
        
        .c-cream {
            background: var(--cream-card);
        }
        
        .c-white {
            background: #ffffff;
        }
        
        .c-purple {
            background: var(--purple-deep);
            color: var(--cream);
        }
        
        .noscroll::-webkit-scrollbar {
            display: none;
        }
        
        .noscroll {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* Top Workspace Bar (Desktop + Mobile Switcher) */
        
        .top-omni-bar {
            position: sticky;
            top: 0;
            z-index: 90;
            background: rgba(255, 246, 230, 0.96);
            backdrop-filter: blur(10px);
            border-bottom: 2.5px solid var(--brown);
            padding: 8px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            flex-wrap: wrap;
        }
        
        .brand-logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font: 800 19px/1 'Baloo 2', cursive;
        }
        
        .brand-badge {
            background: #FF5E5B;
            color: #fff;
            font: 900 10.5px/1 'Nunito', sans-serif;
            padding: 4px 8px;
            border-radius: 999px;
            border: 2px solid var(--brown);
            box-shadow: 0 2px 0 var(--brown);
        }
        
        .omni-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        /* App Container Layout */
        
        .workspace-wrap {
            max-width: 1360px;
            margin: 0 auto;
            padding: 14px 10px 36px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 22px;
        }
        /* Phone shell */
        
        .phone-frame {
            position: relative;
            width: 100%;
            max-width: 440px;
            height: 880px;
            background-color: var(--cream);
            background-image: radial-gradient(#F3DCB3 2px, transparent 2.5px);
            background-size: 22px 22px;
            border-radius: 38px;
            border: 4px solid var(--brown);
            box-shadow: 0 14px 0 var(--brown), 0 22px 46px rgba(74, 44, 29, 0.26);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }
        
        .workspace-wrap.wide-mode .phone-frame {
            max-width: 960px;
            height: 880px;
            border-radius: 32px;
        }
        /* Desktop Side Companion Panel */
        
        .side-companion {
            flex: 1;
            min-width: 320px;
            max-width: 460px;
            display: block;
        }
        
        .side-companion>*+* {
            margin-top: 16px;
        }
        
        @media (max-width: 920px) {
            .side-companion {
                display: none;
            }
            .workspace-wrap {
                padding: 6px 4px 16px;
            }
            .phone-frame {
                max-width: 100%;
                height: calc(100vh - 64px);
                min-height: 680px;
                border-radius: 26px;
            }
        }
        /* App Header inside Phone */
        
        .app-header {
            flex: none;
            padding: 10px 14px 8px;
            background: rgba(255, 246, 230, 0.96);
            border-bottom: 2px dashed rgba(74, 44, 29, 0.18);
            z-index: 15;
        }
        
        .header-top-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        
        .header-quick-bar {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 6px;
            margin-top: 8px;
        }
        
        .quick-pill-btn {
            min-height: 32px;
            padding: 4px 4px;
            border-radius: 11px;
            font: 800 11px/1.1 'Nunito', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            text-align: center;
            white-space: nowrap;
        }
        
        .user-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #fff;
            padding: 4px 10px 4px 5px;
            border-radius: 999px;
            border: 2px solid var(--brown);
            box-shadow: 0 3px 0 var(--brown);
            cursor: pointer;
            min-width: 0;
        }
        
        .user-avatar-ring {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--butter);
            border: 2px solid var(--brown);
            display: grid;
            place-items: center;
            position: relative;
            flex: none;
        }
        
        .user-avatar-ring.vip-gold {
            box-shadow: 0 0 0 2.5px #FF9F1C, 0 0 10px #FFD166;
        }
        
        .streak-badge {
            position: absolute;
            bottom: -4px;
            right: -6px;
            background: #FF5E5B;
            color: #fff;
            font: 900 9.5px/1 'Nunito', sans-serif;
            padding: 2px 4px;
            border-radius: 999px;
            border: 1.5px solid var(--brown);
        }
        
        .currency-cluster {
            display: flex;
            align-items: center;
            gap: 6px;
            flex: none;
        }
        
        .curr-btn {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 5px 9px;
            border-radius: 999px;
            font: 800 13.5px/1 'Baloo 2', cursive;
        }
        /* CRITICAL FIX: Main Scroll Area uses display:block so children NEVER get flex-squished! */
        
        .app-main {
            flex: 1;
            display: block;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 12px 14px 110px;
            position: relative;
        }
        
        .app-main>*+* {
            margin-top: 14px;
        }
        /* Bottom Navigation */
        
        .bottom-nav {
            position: absolute;
            left: 10px;
            right: 10px;
            bottom: 10px;
            height: 68px;
            background: #fff;
            border-radius: 34px;
            border: 2.5px solid var(--brown);
            display: flex;
            gap: 3px;
            padding: 5px;
            box-shadow: 0 6px 0 var(--brown), 0 12px 24px rgba(74, 44, 29, 0.22);
            z-index: 25;
        }
        
        .nav-tab {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            border-radius: 26px;
            font: 800 10.5px/1.1 'Nunito', sans-serif;
            color: var(--brown);
            position: relative;
            transition: background 0.15s, transform 0.1s;
        }
        
        .nav-tab.active {
            background: var(--butter);
            border: 2px solid var(--brown);
            box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.7), 0 2px 0 var(--brown);
            transform: translateY(-2px);
        }
        
        .nav-tab .tab-ico {
            font-size: 19px;
            line-height: 1;
        }
        
        .nav-badge {
            position: absolute;
            top: 3px;
            right: 6px;
            background: #FF5E5B;
            color: #fff;
            font: 900 9px/1 'Nunito', sans-serif;
            padding: 2px 4px;
            border-radius: 999px;
            border: 1.5px solid var(--brown);
        }
        /* Barn Window Camera HUD — Explicit Fixed Dimensions so it NEVER collapses */
        
        .cam-barn-frame {
            position: relative;
            display: block;
            width: 100%;
            height: 276px;
            min-height: 276px;
            border-radius: 30px;
            background: #C98F5E;
            padding: 8px;
            border: 3px solid var(--brown);
            box-shadow: 0 6px 0 var(--brown);
            transition: background 0.25s;
        }
        
        .cam-barn-frame.skin-y2k {
            background: linear-gradient(135deg, #FF7EB3, #FF758C, #7AFCFF);
        }
        
        .cam-barn-frame.skin-cyber {
            background: linear-gradient(135deg, #00F5D4, #7B2CBF, #F72585);
        }
        
        .cam-viewport {
            position: relative;
            width: 100%;
            height: 254px;
            min-height: 254px;
            border-radius: 22px;
            border: 2.5px solid var(--brown);
            overflow: hidden;
            background: linear-gradient(180deg, #C9EBFF 0%, #C9EBFF 34%, #B9EBB2 34%, #B9EBB2 48%, #F6DCA0 48%, #EBC374 100%);
            user-select: none;
        }
        
        .cam-viewport.pond-bg {
            background: linear-gradient(180deg, #C9EBFF 0%, #B9EBB2 28%, #48CAE4 28%, #0077B6 100%);
        }
        
        .cam-viewport.veggie-bg {
            background: linear-gradient(180deg, #C9EBFF 0%, #B9EBB2 34%, #8D5B4C 34%, #6D4538 100%);
        }
        
        .cam-stage {
            position: absolute;
            inset: 0;
            transition: transform 0.35s cubic-bezier(.2, .8, .3, 1);
            transform-origin: center center;
        }
        
        .cam-stage.zoom-2x {
            transform: scale(1.38) translate(6%, 4%);
        }
        
        .cam-stage.angle-2 {
            transform: scale(1.22) translateY(-8%);
        }
        /* Night / Disco / Heater / Mist Overlays */
        
        .cam-disco-overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(125deg, rgba(255, 0, 128, 0.28), rgba(0, 255, 255, 0.28), rgba(255, 230, 0, 0.28));
            background-size: 300% 300%;
            animation: discoShift 1.2s linear infinite;
            mix-blend-mode: overlay;
        }
        
        .cam-heater-overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(circle at 80% 20%, rgba(255, 90, 40, 0.42), transparent 65%);
        }
        
        .cam-mist-overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(circle at 50% 30%, rgba(255, 255, 255, 0.65), rgba(200, 240, 255, 0.25) 70%);
            animation: pulseMist 1.5s ease-in-out infinite alternate;
        }
        
        .marquee-banner {
            position: absolute;
            top: 34px;
            left: 0;
            right: 0;
            background: rgba(74, 44, 29, 0.86);
            color: var(--butter);
            font: 800 11.5px/1.55 'Nunito', sans-serif;
            padding: 2px 0;
            overflow: hidden;
            white-space: nowrap;
            z-index: 8;
            border-top: 1.5px solid var(--butter);
            border-bottom: 1.5px solid var(--butter);
        }
        
        .marquee-inner {
            display: inline-block;
            padding-left: 100%;
            animation: marqueeScroll 12s linear infinite;
        }
        /* Animations */
        
        @keyframes bob {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-6px);
            }
        }
        
        @keyframes wob {
            0%,
            100% {
                transform: rotate(-4deg);
            }
            50% {
                transform: rotate(4deg);
            }
        }
        
        @keyframes peck {
            0%,
            100% {
                transform: rotate(0deg) translateY(0);
            }
            40% {
                transform: rotate(22deg) translateY(6px);
            }
        }
        
        @keyframes cloud {
            0% {
                transform: translateX(-14px);
            }
            100% {
                transform: translateX(22px);
            }
        }
        
        @keyframes discoShift {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }
        
        @keyframes pulseMist {
            0% {
                opacity: 0.45;
            }
            100% {
                opacity: 0.85;
            }
        }
        
        @keyframes marqueeScroll {
            0% {
                transform: translateX(0);
            }
            100% {
                transform: translateX(-100%);
            }
        }
        
        @keyframes floatUp {
            0% {
                transform: translate(-50%, 12px) scale(0.6);
                opacity: 0;
            }
            20% {
                transform: translate(-50%, 0) scale(1.06);
                opacity: 1;
            }
            85% {
                transform: translate(-50%, -28px) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -42px) scale(0.9);
                opacity: 0;
            }
        }
        
        @keyframes particleFall {
            0% {
                transform: translateY(-20px) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(240px) rotate(320deg);
                opacity: 0;
            }
        }
        
        @keyframes laserMove {
            0% {
                left: 20%;
                top: 68%;
            }
            25% {
                left: 72%;
                top: 58%;
            }
            50% {
                left: 42%;
                top: 80%;
            }
            75% {
                left: 78%;
                top: 72%;
            }
            100% {
                left: 20%;
                top: 68%;
            }
        }
        /* Modals & Bottom Sheets — display:block to avoid flex squishing */
        
        .modal-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(74, 44, 29, 0.6);
            backdrop-filter: blur(3px);
            z-index: 60;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }
        
        .modal-backdrop.center-modal {
            align-items: center;
            padding: 14px;
        }
        
        .bottom-sheet {
            display: block;
            width: 100%;
            max-height: 86%;
            background: var(--cream);
            border-top: 3.5px solid var(--brown);
            border-radius: 32px 32px 0 0;
            padding: 14px 14px 26px;
            overflow-y: auto;
            box-shadow: 0 -8px 30px rgba(74, 44, 29, 0.28);
            animation: slideUp 0.18s ease-out;
        }
        
        .dialog-card {
            display: block;
            width: 100%;
            max-width: 396px;
            max-height: 88%;
            background: var(--cream);
            border: 3.5px solid var(--brown);
            border-radius: 28px;
            padding: 16px 14px 20px;
            overflow-y: auto;
            box-shadow: 0 10px 0 var(--brown);
        }
        
        @keyframes slideUp {
            from {
                transform: translateY(36px);
                opacity: 0.6;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        /* Toast Notification */
        
        .toast-pill {
            position: absolute;
            top: 98px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 85;
            width: max-content;
            max-width: 92%;
            background: var(--brown);
            color: var(--cream);
            border: 2px solid var(--butter);
            border-radius: 18px;
            padding: 9px 14px;
            font: 800 13px/1.35 'Nunito', sans-serif;
            text-align: center;
            box-shadow: 0 6px 0 rgba(0, 0, 0, 0.25);
            pointer-events: none;
        }
        /* Form Inputs */
        
        .cozy-input {
            width: 100%;
            min-height: 44px;
            border: 2.5px solid var(--brown);
            border-radius: 14px;
            padding: 7px 12px;
            font: 700 14px/1.2 'Nunito', sans-serif;
            background: #fff;
            color: var(--brown);
            outline: none;
            box-shadow: inset 0 3px 0 rgba(74, 44, 29, 0.08);
        }
        
        .cozy-input:focus {
            border-color: #FF7F6E;
            box-shadow: 0 0 0 3px rgba(255, 127, 110, 0.25);
        }
        /* Non-clipping 2x2 Grid Sub-Tabs */
        
        .sub-tabs-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px;
            width: 100%;
        }
        
        .sub-tab-btn {
            min-height: 42px;
            padding: 6px 10px;
            border-radius: 14px;
            font: 800 13px/1.15 'Nunito', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-align: center;
        }
        /* ============ THEME v2: "Nông Trại Sticker-Holo" ============ */
        
        @keyframes bellRing {
            from {
                transform: translateX(-50%) rotate(-18deg);
            }
            to {
                transform: translateX(-50%) rotate(18deg);
            }
        }
        
        @keyframes skyShift {
            0%,
            100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }
        
        @keyframes holoSweep {
            0% {
                background-position: -200% 0;
            }
            100% {
                background-position: 200% 0;
            }
        }
        
        @keyframes floatCloud {
            from {
                transform: translateX(-30vw);
            }
            to {
                transform: translateX(130vw);
            }
        }
        
        @keyframes sway {
            0%,
            100% {
                transform: skewX(-4deg);
            }
            50% {
                transform: skewX(4deg);
            }
        }
        
        @keyframes pulseGlow {
            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(255, 94, 91, .55);
            }
            50% {
                box-shadow: 0 0 0 7px rgba(255, 94, 91, 0);
            }
        }
        
        html,
        body {
            background-color: #FFE9C7;
            background-image: radial-gradient(circle at 15% 20%, rgba(255, 214, 107, .55) 0, transparent 38%), radial-gradient(circle at 85% 15%, rgba(181, 222, 255, .75) 0, transparent 40%), radial-gradient(circle at 75% 85%, rgba(168, 230, 207, .7) 0, transparent 42%), radial-gradient(circle at 10% 90%, rgba(220, 203, 255, .7) 0, transparent 40%), linear-gradient(120deg, #FFF1D6, #FFE0D3, #E3F4FF, #E6FBEF);
            background-size: 100% 100%, 100% 100%, 100% 100%, 100% 100%, 300% 300%;
            background-attachment: fixed;
            animation: skyShift 24s ease-in-out infinite;
        }
        
        body::before,
        body::after {
            content: '☁️';
            position: fixed;
            z-index: 0;
            pointer-events: none;
            opacity: .55;
            font-size: 90px;
            top: 9vh;
            left: 0;
            animation: floatCloud 70s linear infinite;
        }
        
        body::after {
            content: '☁️';
            font-size: 60px;
            top: 62vh;
            animation-duration: 95s;
            animation-delay: -40s;
        }
        
        .workspace-wrap,
        .top-omni-bar {
            position: relative;
            z-index: 2;
        }
        
        .top-omni-bar {
            background: rgba(255, 250, 240, .72);
            backdrop-filter: blur(16px) saturate(1.6);
            border-bottom: 2.5px solid var(--brown);
        }
        
        .brand-logo {
            font-size: 22px;
            letter-spacing: -.3px;
        }
        
        .brand-badge {
            animation: pulseGlow 2s infinite;
            transform: rotate(-4deg);
        }
        
        .phone-frame {
            background-color: #FFF8EC;
            background-image: linear-gradient(rgba(74, 44, 29, .045) 1px, transparent 1px), linear-gradient(90deg, rgba(74, 44, 29, .045) 1px, transparent 1px);
            background-size: 20px 20px;

                class SoundEngine {
                    constructor() {
                        this.enabled = true;
                        this.ctx = null;
                    }
                    init() {
                        if (!this.ctx && (window.AudioContext || window.webkitAudioContext)) {
                            this.ctx = new(window.AudioContext || window.webkitAudioContext)();
                        }
                        if (this.ctx && this.ctx.state === 'suspended') {
                            this.ctx.resume();
                        }
                    }
                    play(type) {
                        if (!this.enabled) return;
                        try {
                            this.init();
                            if (!this.ctx) return;
                            const now = this.ctx.currentTime;
                            const osc = this.ctx.createOscillator();
                            const gain = this.ctx.createGain();
                            osc.connect(gain);
                            gain.connect(this.ctx.destination);

                                osc.type = 'sine';
                                osc.frequency.setValueAtTime(520, now);
                                osc.frequency.exponentialRampToValueAtTime(880, now + 0.08);
                                gain.gain.setValueAtTime(0.15, now);
                                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.09);
                                osc.start(now);
                                osc.stop(now + 0.09);
                            } else if (type === 'coin') {
                                osc.type = 'triangle';
                                osc.frequency.setValueAtTime(987.77, now);
                                osc.frequency.setValueAtTime(1318.51, now + 0.07);
                                gain.gain.setValueAtTime(0.18, now);
                                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.24);
                                osc.start(now);
                                osc.stop(now + 0.24);
                            } else if (type === 'cluck') {
                                osc.type = 'sawtooth';
                                osc.frequency.setValueAtTime(420, now);
                                osc.frequency.exponentialRampToValueAtTime(680, now + 0.06);
                                osc.frequency.exponentialRampToValueAtTime(340, now + 0.14);
                                gain.gain.setValueAtTime(0.14, now);
                                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.16);

                                    const o = this.ctx.createOscillator();
                                    const g = this.ctx.createGain();
                                    o.type = 'triangle';
                                    o.connect(g);
                                    g.connect(this.ctx.destination);
                                    o.frequency.setValueAtTime(freq, now + idx * 0.07);
                                    g.gain.setValueAtTime(0.16, now + idx * 0.07);

                // =========================================================================
                // 4. MAIN APPLICATION CONTROLLER
                // =========================================================================
                class CloudFarmApp {
                    constructor() {
                        this.sfx = new SoundEngine();
                        this.state = this.loadState();
                        this.initTimers();
                        this.renderAll();
                    }

                    loadState() {
                        try {
                            const raw = localStorage.getItem('CLOUD_FARM_GENZ_V4');
                            if (raw) {
                                const parsed = JSON.parse(raw);
                                return Object.assign({}, DEFAULT_STATE, parsed, {
                                    user: Object.assign({}, DEFAULT_STATE.user, parsed.user || {}),
                                    cam: Object.assign({}, DEFAULT_STATE.cam, parsed.cam || {}),
                                    modal: null
                                });
                            }
                        } catch (e) {}
                        return JSON.parse(JSON.stringify(DEFAULT_STATE));
                    }

                    saveState() {
                        try {
                            localStorage.setItem('CLOUD_FARM_GENZ_V4', JSON.stringify(this.state));
                        } catch (e) {}
                    }

                    resetDemo() {
                        try {
                            localStorage.removeItem('CLOUD_FARM_GENZ_V4');
                        } catch (e) {}
                        this.state = JSON.parse(JSON.stringify(DEFAULT_STATE));
                        this.sfx.play('fanfare');
                        this.toast('🔄 Đã khôi phục dữ liệu mẫu ban đầu!');
                        this.renderAll();
                    }

                    initTimers() {
                        this._auctionTimer = setInterval(() => {
                            if (this.state.tab === 'market' && this.state.marketTab === 'auction') {
                                const a = this.state.auction;
                                if (a.secs > 0) {
                                    a.secs -= 1;
                                    if (a.secs === 8 && a.leader === 'Bạn (@Vy)' && Math.random() < 0.45) {
                                        a.bid += 50;
                                        a.leader = '@Hùng_ĐạiGia';
                                        a.secs += 10;
                                        a.history.unshift({
                                            who: '@Hùng_ĐạiGia',
                                            bid: a.bid,
                                            time: 'Sniper +10s!'
                                        });
                                        this.sfx.play('warn');
                                        this.toast('⚡ @Hùng_ĐạiGia vừa cướp cờ phút chót! Đồng hồ +10 giây!');
                                    }
                                    this.renderMain();
                                }
                            }
                        }, 1000);
                    }

                    fmt(n) {
                        return String(Math.round(Number(n) || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
                    }

                    getActiveAsset() {
                        return this.state.assets.find(a => a.id === this.state.activeAssetId) || this.state.assets[0];
                    }

                    toast(msg) {
                        const el = document.getElementById('toastBox');
                        if (!el) return;
                        el.textContent = msg;
                        el.style.display = 'block';
                        clearTimeout(this._toastTimer);
                        this._toastTimer = setTimeout(() => {
                            el.style.display = 'none';
                        }, 2600);
                    }

                    spendThoc(cost, reason, onSuccess) {
                        cost = Number(cost) || 0;
                        if (this.state.user.thoc < cost) {
                            this.sfx.play('warn');
                            this.toast(`⚠️ Thiếu ${this.fmt(cost - this.state.user.thoc)} Thóc! Bấm vào Ví Thóc để nạp VietQR nhé.`);
                            return false;
                        }
                        this.state.user.thoc -= cost;
                        this.sfx.play('coin');
                        if (onSuccess) onSuccess();
                        if (reason) {
                            this.toast(`${cost > 0 ? '-' + this.fmt(cost) + ' 🌾 · ' : ''}${reason}`);
                        }
                        this.saveState();
                        this.renderAll();
                        return true;
                    }

                    triggerCamVfx(text, particleEmoji, toggleKey) {
                        const c = this.state.cam;
                        c.vfxText = text;
                        const emojis = particleEmoji || ['🌽', '✨', '💛', '🐓', '🎉'];
                        c.vfxParticles = Array.from({
                            length: 12
                        }).map((_, idx) => ({
                            left: 8 + ((idx * 8) % 84),
                            delay: (idx % 5) * 0.12,
                            emoji: emojis[idx % emojis.length]
                        }));
                        if (toggleKey) {
                            c[toggleKey] = !c[toggleKey];
                        }
                        this.sfx.play('cluck');
                        this.renderAll();
                        clearTimeout(this._vfxTimer);
                        this._vfxTimer = setTimeout(() => {
                            this.state.cam.vfxText = '';
                            this.state.cam.vfxParticles = [];
                            this.renderAll();
                        }, 2100);
                    }

                    toggleSound() {
                        this.sfx.enabled = !this.sfx.enabled;
                        const btn = document.getElementById('btnToggleSound');
                        if (btn) btn.textContent = this.sfx.enabled ? '🔊 Âm thanh: BẬT' : '🔇 Âm thanh: TẮT';
                        if (this.sfx.enabled) this.sfx.play('pop');
                    }

                    toggleLayoutMode() {
                        this.state.wideMode = !this.state.wideMode;
                        const wrap = document.getElementById('workspaceWrap');
                        if (wrap) {
                            wrap.classList.toggle('wide-mode', this.state.wideMode);
                        }
                        this.sfx.play('pop');
                        this.toast(this.state.wideMode ? '🖥️ Đã mở rộng khung màn hình Toàn Cảnh' : '📱 Đã chuyển về khung Mobile chuẩn');
                    }

                    switchTab(tabName) {
                        this.state.tab = tabName;
                        this.sfx.play('pop');
                        this.saveState();
                        this.renderAll();
                        const main = document.getElementById('appMain');
                        if (main) main.scrollTop = 0;
                    }

                    openModal(name, data) {
                        this.state.modal = name;
                        this.state.modalData = data || null;
                        this.sfx.play('pop');
                        this.renderModal();
                    }

                    closeModal() {
                        this.state.modal = null;
                        this.state.modalData = null;
                        this.renderModal();
                    }

                    // =========================================================================
                    // 5. FEATURE ACTIONS
                    // =========================================================================

                    getCurrentCoop() {
                        const id = this.state.cam.coopType || 'nhacap4';
                        return COOP_TYPES.find(c => c.id === id) || COOP_TYPES[2];
                    }

                    selectCoopArchitecture(coopId) {
                        const coop = COOP_TYPES.find(c => c.id === coopId);
                        if (!coop) return;
                        if (this.state.cam.coopType === coopId) {
                            this.toast(`🏰 Chuồng hiện tại đã là ${coop.name}!`);
                            return;
                        }
                        this.spendThoc(coop.rent, `🏰 Đã nâng cấp kiến trúc lên ${coop.name} (${coop.buff})!`, () => {
                            this.state.cam.coopType = coopId;
                            const pet = this.getActiveAsset();
                            pet.plotCode = coop.name.replace(/^[^ ]+ /, '').split('(')[0].trim();
                            pet.mood = Math.min(100, pet.mood + 25);
                            if (coopId === 'cungdien') {
                                this.state.user.hasGuardDog = true;
                                pet.clean = 100;
                            }
                            this.sfx.play('fanfare');
                            this.closeModal();
                            this.triggerCamVfx(`🏰 Tân gia: ${coop.name}!`, ['🏰', '🎉', '✨', '👑']);
                        });
                    }

                    toggleDecorItem(decorId) {
                        const item = DECOR_ITEMS.find(d => d.id === decorId);
                        if (!item) return;
                        const list = this.state.cam.decors || [];
                        if (list.includes(decorId)) {
                            this.state.cam.decors = list.filter(x => x !== decorId);
                            this.toast(`🛋️ Đã cất ${item.name} vào kho`);
                            this.saveState();
                            this.renderAll();
                            return;
                        }
                        this.spendThoc(item.price, `🛋️ Đã trang trí ${item.name} vào chuồng!`, () => {
                            if (!this.state.cam.decors) this.state.cam.decors = [];
                            this.state.cam.decors.push(decorId);
                            const pet = this.getActiveAsset();
                            pet.mood = Math.min(100, pet.mood + 15);
                            this.triggerCamVfx(`${item.ico} Đã lắp ${item.name}!`, [item.ico, '✨', '💛']);
                        });
                    }

                    equipFashionItem(fashionId) {
                        const item = FASHION_ITEMS.find(f => f.id === fashionId);
                        if (!item) return;
                        if (this.state.cam.fashion === fashionId) {
                            this.state.cam.fashion = '';
                            this.toast(`👗 Đã tháo phụ kiện ${item.name}`);
                            this.saveState();
                            this.renderAll();
                            return;
                        }
                        this.spendThoc(item.price, `${item.ico} Đã diện ${item.name} cho ${this.getActiveAsset().name}!`, () => {
                            this.state.cam.fashion = fashionId;
                            const pet = this.getActiveAsset();
                            pet.mood = Math.min(100, pet.mood + 20);
                            this.triggerCamVfx(`${item.ico} Lên đồ: ${item.name}!`, [item.ico, '📸', '✨']);
                        });
                    }

                    triggerMicroSpend(microId) {
                        const m = MICRO_SPEND_ITEMS.find(x => x.id === microId);
                        if (!m) return;
                        const pet = this.getActiveAsset();
                        this.spendThoc(m.price, `${m.ico} ${m.name} (-${m.price} Thóc = ${this.fmt(m.price * 100)}đ)`, () => {
                            this.state.cam.microClicks = (this.state.cam.microClicks || 0) + 1;
                            pet.mood = Math.min(100, pet.mood + 4);
                            if (microId === 'm1' || microId === 'm7') pet.weight += 2;
                            if (microId === 'm2') pet.clean = Math.min(100, pet.clean + 2);
                            this.triggerCamVfx(m.vfx, m.emojis);
                        });
                    }

                    selectAsset(id) {
                        this.state.activeAssetId = id;
                        this.sfx.play('cluck');
                        const pet = this.getActiveAsset();
                        this.toast(`🎥 Đang chuyển Camera sang ${pet.name} (${pet.plotCode})`);
                        this.saveState();
                        this.renderAll();
                    }

                    doDailyCheckin() {
                        if (this.state.user.checkedInToday) {
                            this.toast('✅ Hôm nay bạn đã điểm danh nhận Thóc rồi!');
                            return;
                        }
                        this.state.user.checkedInToday = true;
                        this.state.user.streak += 1;
                        this.state.user.thoc += 50;
                        this.sfx.play('fanfare');
                        this.toast(`🔥 Chuỗi ${this.state.user.streak} ngày liên tiếp! Tặng nóng +50 Thóc!`);
                        this.saveState();
                        this.renderAll();
                    }

                    runIoT(type) {
                        const pet = this.getActiveAsset();
                        const clamp = (v) => Math.max(0, Math.min(100, v));
                        if (type === 'voice') {
                            this.openModal('voicePush');
                        } else if (type === 'corn') {
                            this.spendThoc(30, 'Ống phóng IoT bắn ngô lộp bộp!', () => {
                                pet.hunger = clamp(pet.hunger + 22);
                                pet.mood = clamp(pet.mood + 10);

                        this.spendThoc(200, '🏁 Đã mua vé Giải Đua Gà Ăn Nhanh (Quỹ thưởng 1.000 Thóc)!', () => {
                            const r = this.state.race;
                            r.running = true;
                            r.finished = false;
                            r.winner = '';
                            r.racers.forEach(x => {
                                x.pct = 0;
                            });
                            this.renderAll();

                            clearInterval(this._raceTimer);
                            this._raceTimer = setInterval(() => {
                                let someoneWon = null;
                                r.racers.forEach(x => {
                                    const boost = x.me ? 4 : 0;
                                    x.pct = Math.min(100, x.pct + Math.floor(8 + Math.random() * 16 + boost));
                                    if (x.pct >= 100 && !someoneWon) someoneWon = x;
                                });
                                this.renderMain();
                                if (someoneWon) {
                                    clearInterval(this._raceTimer);
                                    r.running = false;
                                    r.finished = true;
                                    r.winner = someoneWon.name;
                                    if (someoneWon.me) {
                                        this.state.user.xu += 80000;

                    buyCatalogService(code) {
                        const srv = SERVICES_80.find(s => s.code === code);
                        if (!srv) return;
                        const pet = this.getActiveAsset();
                        const eff = srv.effect || {};

                        if (eff.buyback) {
                            this.state.user.xu += 96000;
                            this.sfx.play('fanfare');
                            this.closeModal();
                            this.toast('🪙 Trại đã thu mua lại gà (Buy-back)! Cộng +96.000 Xu (60% giá gói) vào ví để nuôi bé mới!');
                            this.saveState();
                            this.renderAll();
                            return;
                        }

                        this.spendThoc(srv.price, `Kích hoạt [${srv.code}] ${srv.name}`, () => {
                            if (eff.hunger) pet.hunger = Math.min(100, pet.hunger + eff.hunger);
                            if (eff.mood) pet.mood = Math.min(100, pet.mood + eff.mood);
                            if (eff.health) pet.health = Math.min(100, pet.health + eff.health);
                            if (eff.clean) pet.clean = Math.min(100, pet.clean + eff.clean);
                            if (eff.weight) pet.weight += eff.weight;
                            if (eff.autoFeed) pet.autoFeed = true;
                            if (eff.insurance) pet.insurance = eff.insurance;
                            if (eff.vipFrame) this.state.user.vipFrame = true;
                            if (eff.guardDog) this.state.user.hasGuardDog = true;
                            if (eff.streakFreeze) this.state.user.streakFrozen = true;
                            if (eff.unlockCam2) {
                                this.state.cam.unlockedAngle2 = true;
                                this.state.cam.angle = 2;
                            }
                            if (eff.skinCycle) this.cycleCamSkin();
                            if (eff.cleanPatron) {
                                this.state.peoplePaidClean = 15;
                                pet.clean = 100;
                                this.state.roomPatron = `${this.state.user.nickname} (${this.state.user.handle})`;
                            }
                            if (eff.cleanChip) {
                                this.state.peoplePaidClean = Math.min(15, this.state.peoplePaidClean + 1);
                            }
                            if (eff.clearShame) {
                                pet.shamed = false;
                                const myBed = this.state.beds.find(b => b.me);
                                if (myBed) myBed.shamed = false;
                            }
                            if (eff.harvestOrder) {
                                this.state.orders.unshift({
                                    id: 'ord_' + Date.now(),
                                    title: `${pet.name} — ${eff.harvestOrder}`,
                                    sub: `Mã dịch vụ ${srv.code} · Đang xử lý tại trại`,
                                    status: 'Đã xác nhận đơn'
                                });
                            }
                            if (eff.memorial) {
                                this.state.memorials.unshift({
                                    id: 'mem_' + Date.now(),
                                    name: `${pet.name} (${pet.tagId})`,
                                    epitaph: 'Tốt nghiệp danh dự sau chuỗi ngày ăn sung mặc sướng tại Phòng #A01 🌸',
                                    incense: 1
                                });
                            }
                            if (eff.gacha) {
                                this.closeModal();
                                this.state.user.gachaTickets += 1;
                                this.spinGacha();
                                return;
                            }
                            if (eff.fortune) {
                                this.closeModal();
                                this.state.user.thoc += 30;
                                this.openAiFortune();
                                return;
                            }
                            if (eff.marry) {
                                this.closeModal();
                                this.openModal('marry', {
                                    myPet: pet.name,
                                    partnerPet: 'Gà Chiến #GA019',
                                    partnerOwner: '@Nam'
                                });
                                return;
                            }
                            if (eff.divorce) {
                                pet.marriedTo = '';
                            }
                            if (eff.coopType) {
                                this.state.cam.coopType = eff.coopType;
                            }
                            if (eff.decor) {
                                if (!this.state.cam.decors) this.state.cam.decors = [];
                                if (!this.state.cam.decors.includes(eff.decor)) this.state.cam.decors.push(eff.decor);
                            }
                            if (eff.fashion) {
                                this.state.cam.fashion = eff.fashion;
                            }
                        });
                    }

                    <button class="jelly-sm c-white" style="width:32px;height:32px;border-radius:50%" onclick="window.app.closeModal()">✕</button>
                  </div>

                  <div style="display:flex;gap:6px;margin-bottom:10px">
                    <div style="flex:1;height:8px;border-radius:99px;background:${w.step >= 1 ? '#FF7F6E' : '#E3CDA8'}"></div>
                    <div style="flex:1;height:8px;border-radius:99px;background:${w.step >= 2 ? '#FF7F6E' : '#E3CDA8'}"></div>
                    <div style="flex:1;height:8px;border-radius:99px;background:${w.step >= 3 ? '#FF7F6E' : '#E3CDA8'}"></div>
                  </div>

                  ${w.step === 1 ? `
                    <div style="display:flex;flex-direction:column;gap:8px">
                      <button class="jelly ${w.rentOpt === 'A' ? 'c-butter' : 'c-white'}" style="padding:11px;text-align:left;display:flex;justify-content:space-between;align-items:center" onclick="window.app.state.wizard.rentOpt='A';window.app.renderModal()">
                        <span><b>Option A: 1 Giường Ký Túc Xá</b><br><span style="font-size:11.5px">Vui nhộn, ở cùng 14 bạn trẻ trong Phòng Trọ</span></span>
                        <span style="font:800 15px/1 'Baloo 2'">290🌾</span>
                      </button>
                      <button class="jelly ${w.rentOpt === 'B' ? 'c-butter' : 'c-white'}" style="padding:11px;text-align:left;display:flex;justify-content:space-between;align-items:center" onclick="window.app.state.wizard.rentOpt='B';window.app.renderModal()">
                        <span><b>Option B: Cặp Đôi 2 Giường (Giảm 30🌾)</b><br><span style="font-size:11.5px">Nuôi 1 Trống 1 Mái hoặc rủ crush nuôi chung</span></span>
                        <span style="font:800 15px/1 'Baloo 2'">550🌾</span>
                      </button>
                      <button class="jelly ${w.rentOpt === 'C' ? 'c-butter' : 'c-white'}" style="padding:11px;text-align:left;display:flex;justify-content:space-between;align-items:center" onclick="window.app.state.wizard.rentOpt='C';window.app.renderModal()">
                        <span><b>Option C: Bao Trọn Biệt Thự 5m²</b><br><span style="font-size:11.5px">Riêng tư tuyệt đối, thả 10–25 con gà gia đình</span></span>
                        <span style="font:800 15px/1 'Baloo 2'">2.200🌾</span>
                      </button>
                    </div>
                  ` : w.step === 2 ? `
                    <div style="display:flex;flex-direction:column;gap:8px">
                      <label style="font-size:12px">Đặt tên khai sinh cho bé gà:
                        <input class="cozy-input" value="${w.petName}" oninput="window.app.state.wizard.petName=this.value" style="margin-top:3px">
                      </label>
                      <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px">
                        <button class="jelly-sm ${w.breedOpt === 'S01' ? 'c-butter' : 'c-white'}" style="padding:8px;text-align:left" onclick="window.app.state.wizard.breedOpt='S01';window.app.renderModal()">
                          <b>Gà Ri Bản Địa (N)</b><br><span style="font-size:11px">390 Thóc</span>
                        </button>
                        <button class="jelly-sm ${w.breedOpt === 'S02' ? 'c-butter' : 'c-white'}" style="padding:8px;text-align:left" onclick="window.app.state.wizard.breedOpt='S02';window.app.renderModal()">
                          <b>Gà Mía Sơn Tây (R)</b><br><span style="font-size:11px">590 Thóc</span>
                        </button>
                        <button class="jelly-sm ${w.breedOpt === 'S03' ? 'c-butter' : 'c-white'}" style="padding:8px;text-align:left" onclick="window.app.state.wizard.breedOpt='S03';window.app.renderModal()">
                          <b>Gà Đen H’Mông (SR)</b><br><span style="font-size:11px">1.190 Thóc</span>
                        </button>
                        <button class="jelly-sm ${w.breedOpt === 'S04' ? 'c-butter' : 'c-white'}" style="padding:8px;text-align:left" onclick="window.app.state.wizard.breedOpt='S04';window.app.renderModal()">
                          <b>Gà Lông Xù Silkie (SSR)</b><br><span style="font-size:11px">1.790 Thóc</span>
                        </button>
                      </div>
                      <label style="display:flex;align-items:center;gap:8px;font-size:12.5px;margin-top:4px">
                        <input type="checkbox" ${w.ringOpt ? 'checked' : ''} onchange="window.app.state.wizard.ringOpt=this.checked;window.app.renderModal()" style="width:20px;height:20px">
                        <span>Đeo Vòng Chân Định Danh Màu Neon (+150 Thóc)</span>
                      </label>
                    </div>
                  ` : `
                    <div style="display:flex;flex-direction:column;gap:8px">
                      <button class="jelly ${w.insOpt === 'gold' ? 'c-butter' : 'c-white'}" style="padding:10px;text-align:left;display:flex;justify-content:space-between;align-items:center" onclick="window.app.state.wizard.insOpt='gold';window.app.renderModal()">
                        <span><b>🛡️ Bảo Hiểm Vàng - Kim Bài Bất Tử (Khuyên dùng)</b><br><span style="font-size:11px">Miễn mọi tiền thuốc; đổi ngay 1 gà CÙNG CÂN NẶNG nếu rủi ro!</span></span>
                        <span style="font:800 14.5px/1 'Baloo 2'">350🌾</span>
                      </button>
                      <button class="jelly ${w.insOpt === 'silver' ? 'c-butter' : 'c-white'}" style="padding:10px;text-align:left;display:flex;justify-content:space-between;align-items:center" onclick="window.app.state.wizard.insOpt='silver';window.app.renderModal()">
                        <span><b>🛡️ Bảo Hiểm Bạc - An Tâm Khởi Đầu</b><br><span style="font-size:11px">Bao vắc-xin định kỳ; đền 1 gà con giống mới nếu rủi ro</span></span>
                        <span style="font:800 14.5px/1 'Baloo 2'">190🌾</span>
                      </button>
                      <button class="jelly ${w.insOpt === 'none' ? 'c-peach' : 'c-white'}" style="padding:10px;text-align:left;display:flex;justify-content:space-between;align-items:center" onclick="window.app.state.wizard.insOpt='none';window.app.renderModal()">
                        <span><b>Không mua Bảo hiểm (Tự gánh rủi ro)</b></span>
                        <span style="font:800 14.5px/1 'Baloo 2'">0🌾</span>
                      </button>
                      ${w.insOpt === 'none' ? `
                        <div style="background:#FFE9A8;border:2px solid var(--brown);border-radius:14px;padding:9px;font-size:12px;color:#B02A18">
                          ⚠️ <b>Cảnh báo:</b> Thời tiết miền Bắc đang giao mùa! 82% người chơi chọn Bảo hiểm Bạc/Vàng để không bị mất trắng gà khi có dịch (Thẻ Hồi Sinh Khẩn Cấp sau khi chết tốn tới 990 Thóc!).
                        </div>
                      ` : ''}
                    </div>
                  `}

                  <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px">
                    <div>
                      <div style="font-size:11px;color:var(--brown-soft)">Tổng tạm tính</div>
                      <div style="font:800 20px/1 'Baloo 2'">${this.fmt(total)} Thóc</div>
                    </div>
                    <div style="display:flex;gap:8px">
                      ${w.step > 1 ? `<button class="jelly-sm c-white" style="padding:9px 12px;font-size:12.5px" onclick="window.app.state.wizard.step-=1;window.app.renderModal()">← Quay lại</button>` : ''}
                      ${w.step < 3
                        ? `<button class="jelly c-coral" style="padding:9px 16px;font-size:14px" onclick="window.app.state.wizard.step+=1;window.app.renderModal()">Tiếp tục →</button>`
                        : `<button class="jelly c-mint" style="padding:9px 16px;font-size:14px" onclick="window.app.completeAdoptWizard()">✅ Chốt Nhận Nuôi</button>`
                      }
                    </div>
                  </div>
                </div>
              </div>
            `;
          } else if (m === 'coopUpgrade') {
            const cur = this.state.cam.coopType || 'nhacap4';
            el.innerHTML = `
              <div class="modal-backdrop" onclick="if(event.target===this)window.app.closeModal()">
                <div class="bottom-sheet noscroll" style="max-height:90%">
                  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
                    <div>
                      <span style="font:800 19px/1.1 'Baloo 2'">🏰 8 Hạng Bất Động Sản Chuồng</span>
                      <div style="font-size:11.5px;color:var(--brown-soft)">Từ Lều Tranh 9k đến Nhà Cấp 4, Biệt Thự & Cung Điện Vua Gà</div>
                    </div>
                    <button class="jelly-sm c-white" style="width:32px;height:32px;border-radius:50%" onclick="window.app.closeModal()">✕</button>
                  </div>
                  <div style="display:flex;flex-direction:column;gap:8px;max-height:460px;overflow-y:auto;padding-right:2px">
                    ${COOP_TYPES.map(cp => {
                      const isCur = cp.id === cur;
                      return `
                        <div style="background:${isCur ? 'var(--butter)' : '#fff'};border:2px solid var(--brown);border-radius:16px;padding:10px;display:flex;justify-content:space-between;align-items:center;gap:8px">
                          <div style="flex:1;min-width:0">
                            <div style="font:800 14px/1.2 'Baloo 2'">${cp.name}</div>
                            <div style="font-size:11px;color:var(--brown-soft);margin:2px 0">${cp.desc}</div>
                            <span style="background:var(--mint);border:1px solid var(--brown);border-radius:999px;padding:1px 7px;font-size:10px">${cp.buff}</span>
                          </div>
                          <button class="jelly-sm ${isCur ? 'c-white' : 'c-coral'}" style="padding:7px 10px;font-size:11.5px;flex:none" onclick="window.app.selectCoopArchitecture('${cp.id}')">
                            ${isCur ? '✅ Đang Ở' : `${this.fmt(cp.rent)}🌾/th`}
                          </button>
                        </div>
                      `;
                    }).join('')}
                  </div>
                </div>
              </div>
            `;
          } else if (m === 'decorShop') {
            const owned = this.state.cam.decors || [];
            el.innerHTML = `
              <div class="modal-backdrop" onclick="if(event.target===this)window.app.closeModal()">
                <div class="bottom-sheet noscroll" style="max-height:88%">
                  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
                    <div>
                      <span style="font:800 19px/1.1 'Baloo 2'">🛋️ Độ Nội Thất & Sân Chơi Chuồng</span>
                      <div style="font-size:11.5px;color:var(--brown-soft)">Mua món nào là hiển thị trực tiếp ngay trên Camera Live!</div>
                    </div>
                    <button class="jelly-sm c-white" style="width:32px;height:32px;border-radius:50%" onclick="window.app.closeModal()">✕</button>
                  </div>
                  <div style="display:flex;flex-direction:column;gap:8px;max-height:430px;overflow-y:auto">
                    ${DECOR_ITEMS.map(d => {
                      const has = owned.includes(d.id);
                      return `
                        <div style="background:#fff;border:2px solid var(--brown);border-radius:16px;padding:9px 11px;display:flex;justify-content:space-between;align-items:center;gap:8px">
                          <div style="display:flex;align-items:center;gap:9px;min-width:0">
                            <span style="width:42px;height:42px;border-radius:12px;background:var(--cream);border:1.5px solid var(--brown);display:grid;place-items:center;font-size:22px;flex:none">${d.ico}</span>
                            <div>
                              <div style="font:800 13.5px/1.2 Nunito">${d.name}</div>
                              <div style="font-size:11px;color:var(--brown-soft)">${d.desc}</div>
                            </div>
                          </div>
                          <button class="jelly-sm ${has ? 'c-butter' : 'c-mint'}" style="padding:7px 10px;font-size:11.5px;flex:none" onclick="window.app.toggleDecorItem('${d.id}')">
                            ${has ? '✅ Đang Lắp (Cất)' : `${d.price}🌾`}
                          </button>
                        </div>
                      `;
                    }).join('')}
                  </div>
                </div>
              </div>
            `;
          } else if (m === 'fashionShop') {
            const curF = this.state.cam.fashion || '';
            el.innerHTML = `
              <div class="modal-backdrop" onclick="if(event.target===this)window.app.closeModal()">
                <div class="bottom-sheet noscroll" style="max-height:85%">
                  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
                    <div>
                      <span style="font:800 19px/1.1 'Baloo 2'">🕶️ Tủ Đồ Thời Trang Thú Cưng</span>
                      <div style="font-size:11.5px;color:var(--brown-soft)">Lên đồ cực ngầu cho bé gà nổi bật nhất Phòng Trọ #A01</div>
                    </div>
                    <button class="jelly-sm c-white" style="width:32px;height:32px;border-radius:50%" onclick="window.app.closeModal()">✕</button>
                  </div>
                  <div style="display:flex;flex-direction:column;gap:8px">
                    ${FASHION_ITEMS.map(f => {
                      const on = curF === f.id;
                      return `
                        <div style="background:#fff;border:2px solid var(--brown);border-radius:16px;padding:9px 11px;display:flex;justify-content:space-between;align-items:center;gap:8px">
                          <div style="display:flex;align-items:center;gap:9px">
                            <span style="width:42px;height:42px;border-radius:12px;background:var(--peach);border:1.5px solid var(--brown);display:grid;place-items:center;font-size:22px;flex:none">${f.ico}</span>
                            <div>
                              <div style="font:800 13.5px/1.2 Nunito">${f.name}</div>
                              <div style="font-size:11px;color:var(--brown-soft)">${f.desc}</div>
                            </div>
                          </div>
                          <button class="jelly-sm ${on ? 'c-butter' : 'c-coral'}" style="padding:7px 10px;font-size:11.5px;flex:none" onclick="window.app.equipFashionItem('${f.id}')">
                            ${on ? '✅ Đang Mặc (Tháo)' : `${f.price}🌾`}
                          </button>
                        </div>
                      `;
                    }).join('')}
                  </div>
                </div>
              </div>
            `;
          } else if (m === 'services80') {
            const tierNames = [
              { t: 0, l: 'Tất cả (90)' },
              { t: 1, l: 'T1: Giống & CCCD' },
              { t: 2, l: 'T2: Dinh Dưỡng' },
              { t: 3, l: 'T3: IoT 0.5s' },
              { t: 4, l: 'T4: AR & Flexing' },
              { t: 5, l: 'T5: Vệ Sinh & Spa' },
              { t: 6, l: 'T6: Y Tế & BH' },
              { t: 7, l: 'T7: Drama & PvP' },
              { t: 8, l: 'T8: P2P & Thu Hoạch' },
              { t: 9, l: 'T9: Biệt Thự & Độ Chuồng' }
            ];
            const ft = this.state.serviceFilterTier || 0;
            const q = (this.state.serviceSearch || '').toLowerCase().trim();
            const filtered = SERVICES_80.filter(x => {
              if (ft > 0 && x.tier !== ft) return false;
              if (q && !(x.code.toLowerCase().includes(q) || x.name.toLowerCase().includes(q) || x.desc.toLowerCase().includes(q))) return false;
              return true;
            });

            el.innerHTML = `
              <div class="modal-backdrop" onclick="if(event.target===this)window.app.closeModal()">
                <div class="bottom-sheet noscroll" style="max-height:92%">
                  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
                    <div>
                      <span style="font:800 19px/1.1 'Baloo 2'">📜 Siêu Thị 80 Dịch Vụ (${filtered.length}/80)</span>
                      <div style="font-size:11px;color:var(--brown-soft)">8 Tầng Doanh Thu từ Master PRD · Bấm để kích hoạt ngay</div>
                    </div>
                    <button class="jelly-sm c-white" style="width:32px;height:32px;border-radius:50%" onclick="window.app.closeModal()">✕</button>
                  </div>

                  <input class="cozy-input" placeholder="🔍 Tìm mã dịch vụ (VD: S26, S59, kết hôn, trộm, spa...)" value="${this.state.serviceSearch}" oninput="window.app.state.serviceSearch=this.value;window.app.renderModal()" style="margin-bottom:8px">

                  <!-- Wrapped Filter Pills so all 9 Tiers are 100% visible at once -->
                  <div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px">
                    ${tierNames.map(tn => `
                      <button class="jelly-sm ${ft === tn.t ? 'c-butter' : 'c-white'}" style="padding:5px 8px;font-size:11px" onclick="window.app.state.serviceFilterTier=${tn.t};window.app.renderModal()">
                        ${tn.l}
                      </button>
                    `).join('')}
                  </div>

                  <div style="display:flex;flex-direction:column;gap:7px;max-height:420px;overflow-y:auto;padding-right:2px">
                    ${filtered.map(srv => `
                      <div style="background:#fff;border:1.8px solid var(--brown);border-radius:14px;padding:8px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px">
                        <div style="flex:1;min-width:0">
                          <div style="font:800 13px/1.2 Nunito">
                            <span style="background:var(--butter);border:1px solid var(--brown);border-radius:6px;padding:1px 5px;font-size:10.5px;margin-right:4px">${srv.code}</span>
                            ${srv.name}
                          </div>
                          <div style="font-size:11px;color:var(--brown-soft);margin-top:2px">${srv.desc}</div>
                        </div>
                        <button class="jelly-sm ${srv.effect && srv.effect.buyback ? 'c-butter' : 'c-mint'}" style="padding:6px 9px;font-size:11.5px;flex:none" onclick="window.app.buyCatalogService('${srv.code}')">
                          ${srv.effect && srv.effect.buyback ? '+96k Xu' : srv.price > 0 ? `${this.fmt(srv.price)}🌾` : 'Tự động'}
                        </button>
                      </div>
                    `).join('')}
                  </div>
                </div>
              </div>
            `;
          }
        }
      }

      window.addEventListener('DOMContentLoaded', function() {
        window.app = new CloudFarmApp();
      });
    })();
    </script>
</body>

</html>
